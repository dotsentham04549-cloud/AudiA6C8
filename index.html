<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Склад разбора A6</title>
<meta name="theme-color" content="#151515">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="vendor/JsBarcode.all.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* Layout: warehouse terminal — sticky header with counters and tabs, then one working surface per tab; intake = search column + detail column */
:root{
  --paper:#F4F4F1; --surface:#FFFFFF; --ink:#151515; --muted:#686862; --line:#DADAD3; --soft:#ECECE7;
  --accent:#E3A500; --accent-ink:#151515; --btn:#151515; --btn-fg:#FFFFFF;
  --ok:#1E7A3D; --warn:#B26A00; --bad:#B42318; --info:#2449B8;
  --label:#FFFFFF; --label-ink:#000000;
  --f-ui:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111111; --surface:#1B1B1A; --ink:#F1F1EC; --muted:#9C9C95; --line:#30302D; --soft:#242422;
  --btn:#F1F1EC; --btn-fg:#111111; --ok:#4CC271; --warn:#F0A63A; --bad:#FF7A6B; --info:#8AA6FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111111; --surface:#1B1B1A; --ink:#F1F1EC; --muted:#9C9C95; --line:#30302D; --soft:#242422;
  --btn:#F1F1EC; --btn-fg:#111111; --ok:#4CC271; --warn:#F0A63A; --bad:#FF7A6B; --info:#8AA6FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{font-family:var(--f-ui);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 0;border-bottom:1px solid var(--line)}
@media (max-width:700px){header.top{position:static}}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1 small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.counters{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip b{font-weight:700}
.printbtn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:7px 14px;font-size:14px}
.printbtn[disabled]{opacity:.45;cursor:default}
nav.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.banner{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--soft);font-size:14px}
.banner.bad{border-left:4px solid var(--bad)}

main{padding-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.intake{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.intake{grid-template-columns:minmax(0,1fr)}}
.searchbox{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.searchbox input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:8px;padding:13px 14px;font-size:19px;background:var(--surface);font-family:var(--f-mono);letter-spacing:.02em}
.searchbox input::placeholder{font-family:var(--f-ui);letter-spacing:0;color:var(--muted);font-size:16px}
.hint{padding:8px 14px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.results{list-style:none;margin:0;padding:0;max-height:64vh;overflow:auto}
.results li{border-bottom:1px solid var(--line)}
.results li:last-child{border-bottom:0}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:none;border:0;padding:11px 14px}
.res:hover,.res[aria-selected="true"]{background:var(--soft)}
.res .nm{font-weight:600}
.res .sub{grid-column:1/2;color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.res .pr{text-align:right;font-weight:700;white-space:nowrap}
.res .pr small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;border:1px solid currentColor}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.info{color:var(--info)} .tag.mute{color:var(--muted)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.detail{padding:16px;display:grid;gap:14px}
.detail h2{margin:0;font-size:20px;line-height:1.25;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv b{font-size:16px}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums button{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px}
.nums button.hit{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
form.add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
form.add .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.03em;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;font-size:15px;color:var(--ink);min-width:0;width:100%}
label.f input.mono{font-family:var(--f-mono)}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:700;background:var(--btn);color:var(--btn-fg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.labelprev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.labelprev canvas{background:var(--label);border-radius:4px;box-shadow:0 0 0 1px var(--line);max-width:100%;height:auto}
a.ext{color:var(--info);font-weight:600}

/* stock */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.toolbar input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr.it{cursor:pointer}
tr.it:hover td{background:var(--soft)}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st.removed{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.st.listed{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st.sold{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.defect{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
tr.ed td{background:var(--soft)}
.editor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:4px 0}
@media (max-width:700px){.editor{grid-template-columns:repeat(2,minmax(0,1fr))}}
.editor .full{grid-column:1/-1}

/* plan */
.plan-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}
.bar{flex:1 1 240px;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.grp{padding:10px 14px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--soft);border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.prow.done .pn{color:var(--muted);text-decoration:line-through}
.prow .pn{font-weight:600;min-width:0;overflow-wrap:anywhere}
.prow .pc{font-size:13px;color:var(--muted)}
.prow .cnt{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .acts{grid-column:1/-1}}

/* summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum .panel{padding:14px;min-width:0}
.sum span{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sum b{display:block;font-size:24px;margin-top:4px}
.sum small{color:var(--muted)}
.sect{margin-top:16px;padding:16px}
.sect h3{margin:0 0 10px;font-size:16px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:12px;max-width:640px;width:100%;padding:18px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.dialog textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-family:var(--f-ui);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-fg);padding:11px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.res,.btn,.printbtn{transition:background .12s, opacity .12s}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">
    <h1>Склад разбора A6 <small>Audi A6 C8 · 2020 · 45 TFSI · VIN …032485</small></h1>
    <div class="counters"><button class="printbtn" id="installBtn" hidden style="background:var(--btn);color:var(--btn-fg)">Установить на телефон</button><span id="counters" class="counters"></span></div>
  </div>
  <nav class="tabs" aria-label="Разделы">
    <a href="#priemka" data-tab="priemka">Приёмка</a>
    <a href="#sklad" data-tab="sklad">Склад</a>
    <a href="#plan" data-tab="plan">План разбора</a>
    <a href="#itogi" data-tab="itogi">Итоги</a>
    <a href="#nakleyki" data-tab="nakleyki">Наклейки</a>
  </nav>
  <div id="banner"></div>
</div></header>

<main class="wrap">
  <section id="tab-priemka" class="intake">
    <div class="panel">
      <div class="searchbox">
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Номер с детали, название или A6-0001" aria-label="Поиск детали">
      </div>
      <div class="hint" id="qhint">Номер можно вводить с пробелами и русскими буквами — 4К0 831 051 А найдётся. Enter — открыть первую строку. Сканер штрихкодов работает как клавиатура.</div>
      <ul class="results" id="results" role="listbox" aria-label="Найденные детали"></ul>
    </div>
    <div class="panel" id="detail"></div>
  </section>

  <section id="tab-sklad" hidden>
    <div class="panel">
      <div class="toolbar">
        <input id="sq" type="search" placeholder="Поиск по складу: артикул, номер, название, место" aria-label="Поиск по складу">
        <div class="seg" id="sfilter" role="group" aria-label="Статус"></div>
        <button class="btn ghost small" id="csv">Выгрузить CSV</button>
      </div>
      <div class="tbl" id="stock"></div>
    </div>
  </section>

  <section id="tab-plan" hidden>
    <div class="panel" id="plan"></div>
  </section>

  <section id="tab-itogi" hidden>
    <div id="summary"></div>
  </section>

  <section id="tab-nakleyki" hidden>
    <div class="panel sect" id="labels"></div>
  </section>
</main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>

const NUMIDX=new Map(), BASEIDX=new Map();
const push=(m,k,v)=>{const a=m.get(k); if(a){if(!a.includes(v))a.push(v)} else m.set(k,[v])};
CAT.forEach(e=>e.nums.forEach(n=>{push(NUMIDX,n,e);push(BASEIDX,n.slice(0,9),e)}));
const stem=t=>t.length>5?t.slice(0,t.length-2):t.length>3?t.slice(0,t.length-1):t;
function isNumQuery(q){const n=normNum(q); return /\d/.test(q) && n.length>=4 && !/^A6\d+$/.test(n)}
function searchNum(raw){
  const q=normNum(raw), res=new Map();
  const add=(e,s)=>{ if(!res.has(e.i)||res.get(e.i)<s) res.set(e.i,s) };
  (NUMIDX.get(q)||[]).forEach(e=>add(e,100));
  if(q.length>=9)(BASEIDX.get(q.slice(0,9))||[]).forEach(e=>add(e,85));
  for(const e of CAT) for(const n of e.nums){ if(n.startsWith(q)) add(e,70); else if(q.length>=5&&n.includes(q)) add(e,40) }
  if(!res.size&&q.length>=9){ const mid=q.slice(3,9); for(const e of CAT) for(const n of e.nums) if(n.slice(3,9)===mid) add(e,30) }
  const out=[...res].sort((a,b)=>b[1]-a[1]||(CAT[b[0]].p?1:0)-(CAT[a[0]].p?1:0)).slice(0,50).map(([i,s])=>({t:"cat",e:CAT[i],score:s}));
  return out;
}
function searchName(raw){
  const toks=raw.toLowerCase().replace(/ё/g,"е").split(/[^a-zа-я0-9]+/).filter(Boolean).map(stem);
  if(!toks.length) return [];
  const hit=s=>{s=s.toLowerCase().replace(/ё/g,"е");return toks.every(t=>s.includes(t))};
  const out=[];
  POS.forEach(p=>{ if(p.q>0&&hit(p.n+" "+p.g)) out.push({t:"pos",p}) });
  CAT.forEach(e=>{ if(hit(e.n+" "+e.node+" "+e.g+" "+e.s)) out.push({t:"cat",e}) });
  out.sort((a,b)=>(a.t==="pos"?0:a.e.p?1:2)-(b.t==="pos"?0:b.e.p?1:2));
  return out.slice(0,60);
}
const skuNum=s=>parseInt(String(s||"").replace(/^\s*A6[-\s]?/i,""),10)||0;
function searchSku(raw){
  const n=skuNum(raw); if(!n) return [];
  return ITEMS.filter(it=>skuNum(it.sku)===n).map(it=>({t:"item",it}));
}

const fontsReady = (document.fonts&&document.fonts.load)? Promise.all([document.fonts.load('700 40px "Golos Text"'),document.fonts.load('500 40px "Golos Text"'),document.fonts.load('700 40px "JetBrains Mono"')]).catch(()=>{}) : Promise.resolve();
function wrapLines(ctx,text,maxW,maxLines){
  const words=String(text).split(/\s+/); const lines=[]; let cur="";
  for(const w of words){const t=cur?cur+" "+w:w; if(ctx.measureText(t).width<=maxW) cur=t; else { if(cur) lines.push(cur); cur=w; if(lines.length===maxLines) break } }
  if(lines.length<maxLines&&cur) lines.push(cur);
  if(lines.length>maxLines) lines.length=maxLines;
  const used=lines.join(" ").length; if(used<String(text).length){let l=lines[lines.length-1]; while(l.length&&ctx.measureText(l+"…").width>maxW) l=l.slice(0,-1); lines[lines.length-1]=l+"…"}
  return lines;
}
function renderLabel(it,canvas,displayScale){
  const d=8, W=Math.round(LABEL.w*d), H=Math.round(LABEL.h*d), m=Math.round(1.8*d);
  canvas.width=W; canvas.height=H;
  if(displayScale){canvas.style.width=Math.round(W*displayScale)+"px"}
  const c=canvas.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,W,H); c.fillStyle="#000"; c.textBaseline="top";
  const small=H<260;
  let y=m;
  const skuH=Math.round(H*(small?0.2:0.17));
  c.font=`700 ${skuH}px "JetBrains Mono", monospace`; c.fillText(it.sku||"A6-0000",m,y);
  if(LABEL.price&&it.price){c.font=`700 ${Math.round(skuH*0.62)}px "Golos Text", Arial, sans-serif`; const t=Math.round(it.price).toLocaleString("ru-RU")+" ₽"; c.fillText(t,W-m-c.measureText(t).width,y+skuH*0.3)}
  y+=skuH+Math.round(d*0.6);
  const nameH=Math.round(H*(small?0.105:0.092));
  c.font=`700 ${nameH}px "Golos Text", Arial, sans-serif`;
  const lines=wrapLines(c,it.name||"",W-2*m,small?1:2);
  lines.forEach(l=>{c.fillText(l,m,y); y+=Math.round(nameH*1.15)});
  if(it.oem){c.font=`700 ${Math.round(nameH*0.95)}px "JetBrains Mono", monospace`; c.fillText(it.oem,m,y); y+=Math.round(nameH*1.2)}
  const footH=Math.round(H*(small?0.075:0.065));
  const bcTop=y+Math.round(d*0.4), bcH=H-m-footH-Math.round(d*0.6)-bcTop;
  if(bcH>16&&window.JsBarcode){
    const bc=document.createElement("canvas");
    try{ let mw=4; do{ JsBarcode(bc,it.sku||"A6-0000",{format:"CODE128",displayValue:false,margin:0,height:bcH,width:mw}); mw--; }while(bc.width>W-2*m&&mw>=1);
      c.imageSmoothingEnabled=false; const bw=Math.min(W-2*m,bc.width); c.drawImage(bc,Math.round((W-bw)/2),bcTop,bw,bcH) }catch(_){}
  }
  c.font=`500 ${footH}px "Golos Text", Arial, sans-serif`;
  const foot=wrapLines(c,"A6 C8 · 2020 · DLHA"+(it.loc?" · "+it.loc:""),W-2*m,1)[0]||"";
  c.fillText(foot,m,H-m-footH);
}
async function makePdf(items){
  const {jsPDF}=window.jspdf; const w=LABEL.w,h=LABEL.h, o=w>=h?"l":"p";
  const pdf=new jsPDF({orientation:o,unit:"mm",format:[w,h]});
  const cv=document.createElement("canvas"); await fontsReady;
  items.forEach((it,i)=>{ if(i) pdf.addPage([w,h],o); renderLabel(it,cv); pdf.addImage(cv.toDataURL("image/png"),"PNG",0,0,w,h) });
  return pdf.output("blob");
}
function stripCanvases(items){
  const d=8, W=Math.round(LABEL.w*d), H=Math.round(LABEL.h*d), gap=24, per=Math.max(1,Math.floor(30000/(H+gap)));
  const out=[];
  for(let s=0;s<items.length;s+=per){
    const part=items.slice(s,s+per), cv=document.createElement("canvas");
    cv.width=W; cv.height=part.length*(H+gap)+gap;
    const c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,cv.width,cv.height);
    const one=document.createElement("canvas");
    part.forEach((it,i)=>{ const y=gap+i*(H+gap); renderLabel(it,one); c.drawImage(one,0,y);
      c.fillStyle="#000"; for(let x=0;x<W;x+=16) c.fillRect(x,y+H+gap/2-1,8,2); });
    c.fillStyle="#000"; for(let x=0;x<W;x+=16) c.fillRect(x,gap/2-1,8,2);
    out.push(cv);
  }
  return out;
}

async function printQueue(list,share=true){
  const items=list||queue(); if(!items.length){toast("Очередь печати пуста");return}
  const stamp=new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(/[^\d]/g,"-");
  await fontsReady;
  const files=[];
  if(LABEL.mode==="mini"){
    const cvs=stripCanvases(items);
    for(let k=0;k<cvs.length;k++){ const blob=await toBlob(cvs[k]); files.push(new File([blob],`naklejki-${items[0].sku}-${items.length}sht${cvs.length>1?"-"+(k+1):""}-${stamp}.png`,{type:"image/png"})) }
  } else {
    if(!window.jspdf){toast("Не загрузилась библиотека PDF — обнови страницу");return}
    const blob=await makePdf(items); files.push(new File([blob],`naklejki-${items[0].sku}-${items.length}sht-${stamp}.pdf`,{type:"application/pdf"}));
  }
  const r=await saveFiles(files,{share});
  if(r==="cancel"){toast("Отменено — наклейки остались в очереди");return}
  items.forEach(it=>{ if(!it.printed) it.printed=true }); persist(); renderAll();
  toast(r==="shared"?`Отправлено ${items.length} наклеек`:(LABEL.mode==="mini"?`Лента с ${items.length} наклейками сохранена в Загрузки`:`PDF с ${items.length} наклейками сохранён`));
}

  const el=$("#plan");
  el.innerHTML=`<div class="plan-h"><b class="num">${done} из ${units} шт. разобрано</b><div class="bar" aria-hidden="true"><i style="width:${units?Math.round(done/units*100):0}%"></i></div><span class="note">«Нет» — деталь сгорела или отсутствует, в итогах не считается.</span></div>
  ${groups.map(g=>`<div class="grp">${esc(g)}</div>${act.filter(p=>p.g===g).map(p=>{const r=removedOf(p.id), mis=(PLAN[p.id]&&PLAN[p.id].missing)||0, full=r+mis>=p.q;
    return `<div class="prow ${full?"done":""}"><div><div class="pn">${esc(p.n)} ${riskTag(p.risk)}</div><div class="pc">${rub(p.price)} за шт.${p.nums.length?` · <span class="mono">${esc(p.nums.slice(0,2).join(", "))}</span>`:""}</div></div>
    <div class="cnt">${r}${mis?`+${mis} нет`:""} / ${p.q}</div>
    <div class="acts row"><button class="btn small" data-add="${p.id}" ${full||!canWrite?"disabled":""}>+ Снято</button><button class="btn ghost small" data-miss="${p.id}" ${!canWrite?"disabled":""}>${mis?"Вернуть":"Нет"}</button></div></div>`}).join("")}`).join("")}`;
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const p=POSBY[b.dataset.add]; go("priemka"); $("#q").value=""; QRAW=""; RESULTS=[]; renderResults(); openDetail({t:"pos",p}); setTimeout(()=>{const o=$("#f_oem"); if(o) o.focus()},50)});
  el.querySelectorAll("[data-miss]").forEach(b=>b.onclick=async()=>{const p=POSBY[b.dataset.miss]; const cur=(PLAN[p.id]&&PLAN[p.id].missing)||0; const left=p.q-removedOf(p.id); await putPlan(p.id,{missing:cur?0:Math.max(0,left)})});
}

/* ---------- summary ---------- */
function renderSummary(){
  const act=POS.filter(p=>p.q>0);
  const planSum=act.reduce((s,p)=>s+p.price*Math.max(0,p.q-((PLAN[p.id]&&PLAN[p.id].missing)||0)),0);
  const shelf=ITEMS.filter(i=>i.status==="removed"||i.status==="listed");
  const sold=ITEMS.filter(i=>i.status==="sold");
  const soldSum=sold.reduce((s,i)=>s+(+i.soldPrice||+i.price||0),0);
  const fix=+SETTINGS.fix||0, pct=+SETTINGS.pct||0;
  const comm=fix+soldSum*pct/100;
  const owner=soldSum-comm;
  $("#summary").innerHTML=`<div class="sum">
    <div class="panel"><span>План по ценам Авито</span><b class="num">${rub(planSum)}</b><small>без деталей с отметкой «Нет»</small></div>
    <div class="panel"><span>На полке</span><b class="num">${rub(shelf.reduce((s,i)=>s+(+i.price||0),0))}</b><small>${shelf.length} шт., из них выставлено ${ITEMS.filter(i=>i.status==="listed").length}</small></div>
    <div class="panel"><span>Продано</span><b class="num">${rub(soldSum)}</b><small>${sold.length} шт.</small></div>
    <div class="panel"><span>Собственнику к выплате</span><b class="num" style="color:${owner<0?"var(--warn)":"inherit"}">${rub(Math.max(0,owner))}</b><small>${owner<0?"фикс за разбор удерживается из первых продаж":"продано минус работа"}</small></div>
  </div>
  <div class="panel sect"><h3>Оплата работы</h3>
    <div class="row"><label class="f" style="width:150px">Фикс за разбор, ₽<input id="s_fix" inputmode="numeric" value="${fix}"></label><label class="f" style="width:120px">Процент с продаж<input id="s_pct" inputmode="numeric" value="${pct}"></label><button class="btn small" id="s_save" ${canWrite?"":"disabled"} style="align-self:end">Сохранить</button></div>
    <p class="note">Сейчас за работу: ${rub(fix)} + ${pct}% от ${rub(soldSum)} = <b>${rub(comm)}</b>.</p></div>
  <div class="panel sect"><h3>Резервная копия</h3>
    <p class="note">Склад хранится только в этом телефоне, в памяти браузера. Если очистить данные браузера — записи пропадут. Сохраняй копию раз в несколько дней. Последняя копия: <b>${esc(ls.get("a6.backup","ещё не делалась"))}</b>.</p>
    <div class="row"><button class="btn small" id="bk_save">Сохранить копию</button><label class="btn ghost small" style="display:inline-flex;align-items:center;cursor:pointer">Восстановить из файла<input type="file" id="bk_load" accept=".json,application/json" hidden></label></div></div>
  <div class="panel sect"><h3>Последние продажи</h3>${sold.length?`<div class="tbl"><table><thead><tr><th>Артикул</th><th>Деталь</th><th class="r">Цена в плане</th><th class="r">Продано за</th></tr></thead><tbody>${[...sold].sort((a,b)=>(b.soldTs||0)-(a.soldTs||0)).slice(0,30).map(i=>`<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.name)}</td><td class="r num">${rub(i.price)}</td><td class="r num">${rub(i.soldPrice)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="note">Продаж пока нет. Отметь деталь «Продано» на вкладке «Склад» — она появится здесь.</div>`}</div>`;
  $("#bk_save").onclick=async()=>{ const d=new Date().toLocaleString("ru-RU"); const data=JSON.stringify({v:1,date:d,items:ITEMS,plan:PLAN,settings:SETTINGS}); const r=await saveFiles([new File([data],`sklad-A6-kopiya-${new Date().toISOString().slice(0,10)}.json`,{type:"application/json"})],{share:true}); if(r!=="cancel"){ ls.set("a6.backup",d); renderSummary(); toast("Копия сохранена") } };
  $("#bk_load").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(!Array.isArray(j.items)) throw 0; ITEMS=j.items; PLAN=j.plan||{}; SETTINGS=j.settings||SETTINGS; persist(); renderAll(); toast(`Восстановлено: ${ITEMS.length} деталей`) }catch(_){ toast("Это не файл копии склада") } };
  $("#s_save").onclick=async()=>{ if(await putSettings({fix:+$("#s_fix").value||0,pct:+$("#s_pct").value||0})) toast("Сохранено") };
}

/* ---------- shell ---------- */
let TAB="priemka";
function go(t){ TAB=t; try{history.replaceState(null,"","#"+t)}catch(e){} renderTabs(); }
function renderTabs(){
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===TAB?"page":"false"));
  ["priemka","sklad","plan","itogi","nakleyki"].forEach(t=>$("#tab-"+t).hidden=t!==TAB);
  if(TAB==="sklad") renderStock(); if(TAB==="plan") renderPlan(); if(TAB==="itogi") renderSummary(); if(TAB==="nakleyki") renderLabelsTab();
  if(TAB==="priemka") setTimeout(()=>$("#q").focus(),0);
}
function renderCounters(){
  const q=queue().length, act=POS.filter(p=>p.q>0), units=act.reduce((s,p)=>s+p.q,0);
  const sold=ITEMS.filter(i=>i.status==="sold");
  $("#counters").innerHTML=`<span class="chip">Снято <b class="num">${ITEMS.length}</b>/<span class="num">${units}</span></span><span class="chip">Продано <b class="num">${rub(sold.reduce((s,i)=>s+(+i.soldPrice||0),0))}</b></span><button class="printbtn" id="pbtn" ${q?"":"disabled"}>Печать наклеек: ${q}</button>`;
  $("#pbtn").onclick=()=>printQueue();
}
function renderBanner(){ $("#banner").innerHTML = storageOk? "" : `<div class="banner bad">Браузер не даёт сохранять данные (приватный режим?). Записи пропадут после закрытия — открой сайт в обычной вкладке.</div>`; }
function renderAll(){
  renderCounters(); renderBanner();
  if(TAB==="sklad") renderStock(); if(TAB==="plan") renderPlan(); if(TAB==="itogi") renderSummary(); if(TAB==="nakleyki") renderLabelsTab();
  if(TAB==="priemka"&&CUR&&CUR.t==="item"){const it=ITEMS.find(x=>x.id===CUR.it.id); if(it&&!["INPUT","SELECT"].includes(document.activeElement.tagName)) openItemCard(it)}
  if(TAB==="priemka"&&QRAW) renderResults();
  const s=$("#f_sku"); if(s) s.textContent=nextSku();
}
$("#q").addEventListener("input",runSearch);
$("#q").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"&&RESULTS.length){SEL=Math.min(RESULTS.length-1,SEL+1);renderResults();e.preventDefault()}
  if(e.key==="ArrowUp"&&RESULTS.length){SEL=Math.max(0,SEL-1);renderResults();e.preventDefault()}
  if(e.key==="Enter"){e.preventDefault(); runSearch(); if(SEL>=0){openDetail(RESULTS[SEL]); const f=$("#f_oem")||$("#f_price"); if(f&&RESULTS[SEL].t!=="item") setTimeout(()=>($("#f_price")||f).focus(),0)} }
});
$("#sq").addEventListener("input",renderStock);
$("#csv").onclick=exportCsv;
document.querySelectorAll("nav.tabs a").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.tab)});
const h=(location.hash||"").slice(1); if(["priemka","sklad","plan","itogi","nakleyki"].includes(h)) TAB=h;
renderTabs(); renderResults(); openDetail(null); renderAll();
init();
/* установка на телефон */
let deferredInstall=null;
const isStandalone=()=>(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(!isStandalone())$("#installBtn").hidden=false});
window.addEventListener("appinstalled",()=>{deferredInstall=null;$("#installBtn").hidden=true;toast("Склад установлен — открывай его с главного экрана")});
$("#installBtn").onclick=async()=>{ if(!deferredInstall){toast("Меню Chrome ⋮ → «Установить приложение»");return} deferredInstall.prompt(); try{await deferredInstall.userChoice}catch(_){} deferredInstall=null; $("#installBtn").hidden=true };
</script>
</body>
</html>
